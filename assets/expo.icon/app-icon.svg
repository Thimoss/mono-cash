<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="indigoGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#ambientGlow)"/>

  <circle cx="512" cy="512" r="320" fill="none" stroke="#27272A" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="512" cy="512" r="240" fill="none" stroke="#27272A" stroke-width="1.5" opacity="0.3"/>

  <g transform="translate(0, 0)">
    <path d="M 330 640 A 240 240 0 1 1 694 640" 
          fill="none" 
          stroke="url(#loopGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          opacity="0.35"/>
    <path d="M 340 680 L 340 380 C 340 348 368 328 398 344 L 512 425 L 626 344 C 656 328 684 348 684 380 L 684 680" 
          fill="none" 
          stroke="url(#indigoGradPrimary)" 
          stroke-width="56" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 310 520 C 370 430 460 410 512 480 C 570 560 660 520 720 400" 
          fill="none" 
          stroke="url(#growthGrad)" 
          stroke-width="36" 
          stroke-linecap="round"/>
    <circle cx="720" cy="400" r="22" fill="#10B981" filter="url(#softGlow)"/>
    <circle cx="720" cy="400" r="10" fill="#FFFFFF"/>
    <circle cx="512" cy="480" r="18" fill="#F3F4F6"/>
    <circle cx="512" cy="480" r="8" fill="#6366F1"/>
  </g>
</svg>